# ── LinguaPulse 宿主机 Nginx 配置 ──
# 放到服务器：/etc/nginx/conf.d/linguapulse.conf
# 验证：nginx -t
# 重载：nginx -s reload

# ── HTTP → HTTPS 跳转 ──
server {
    listen 80;
    server_name linguapulse.yyds.kim;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name linguapulse.yyds.kim;

    # ── SSL 证书（DigiCert，90天，到期前需更换 /root/ssl 下文件并 reload）──
    ssl_certificate     /root/ssl/cert.pem;
    ssl_certificate_key /root/ssl/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m;

    # ── API → 后端容器 (127.0.0.1:8000) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── 音频缓存 ──
    location /api/tts/audio/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 前端 Next.js → 前端容器 (127.0.0.1:3000) ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
